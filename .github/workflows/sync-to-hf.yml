name: Sync to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_SYNC_TOKEN: ${{ secrets.HF_SYNC_TOKEN }}
        run: |
          git push https://ghparks:$HF_SYNC_TOKEN@huggingface.co/spaces/ghparks/Oakwiltdetection main --force